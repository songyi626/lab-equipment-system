<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>實驗室設備預約系統 - 登入</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-200">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-slate-800">實驗室設備預約系統</h1>
      <p class="text-slate-500 text-sm mt-1">請輸入帳號密碼以進行預約</p>
    </div>

    {% if error %}
    <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-200">
      {{ error }}
    </div>
    {% endif %}

    <form action="/login" method="post" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">電子信箱 (帳號)</label>
        <input type="email" name="email" required placeholder="admin@lab.edu.tw" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">密碼</label>
        <input type="password" name="password" required placeholder="••••••••" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition duration-200">
        登入系統
      </button>
    </form>

    <div class="mt-6 p-3 bg-blue-50 text-blue-800 text-xs rounded-lg border border-blue-200">
      <p class="font-semibold">預設管理員帳號：</p>
      <p>帳號：<code>admin@lab.edu.tw</code></p>
      <p>密碼：<code>Admin1234</code></p>
    </div>
  </div>
</body>
</html>
